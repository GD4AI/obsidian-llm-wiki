# Dependabot version updates (security updates are always-on and need no config).
#
# Why this exists: the fast-uri 3.1.5 -> 3.1.6 -> 3.1.7 chain (2026-09, four
# GHSA advisories) showed the failure mode this prevents — a vulnerable
# transitive devDep sat pinned by a manual `overrides` entry until a human
# noticed the Dependabot alert and hand-bumped it. The overrides that forced a
# single instance (fast-uri) are gone; the one that genuinely needs pinning
# (brace-expansion 5.0.9, because old minimatch@8/9/3 peers declare ^2/^1 and
# would otherwise pull vulnerable legacy instances) stays. With this file,
# Dependabot opens a PR the day a transitive dep drifts out of range; the
# `pnpm audit --audit-level high` step in pr-ci.yml blocks merges in the
# meantime. Human action reduces to review + merge, not hand-editing four files.
#
# `package-ecosystem: npm` resolves to pnpm here — the repository declares
# `packageManager: pnpm@10.14.0` and carries a `pnpm-workspace.yaml` — so this
# updates `pnpm-lock.yaml` and only `pnpm-lock.yaml`. It does **not** cover
# `package-lock.json`: #652, #706, #707 and #708 each changed exactly
# `package.json` + `pnpm-lock.yaml`. The earlier note here claimed both were
# covered, and that claim is what made three npm PRs look like a gate problem
# rather than a missing half. `dependabot-lockfile.yml` regenerates the npm-side
# lockfile on the PR branch so the gate can stay strict.
# `open-pull-requests-limit` kept low to avoid a burst of dependency churn PRs
# competing with the release queue.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    # No `labels:` — the repo has no `dependencies` label and Dependabot would
    # create one implicitly; the maintainer's triage labels (bug/enhancement)
    # don't fit dependency PRs. Default no-label is fine: the audit gate + CI
    # are the real signal.
    ignore:
      # eslint stays at the Bot-aligned major (10.x per eslint-plugin-obsidianmd
      # review pipeline); never auto-bump across major.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # brace-expansion is force-pinned by overrides (legacy minimatch peers
      # would pull ^2/^1); a Dependabot PR for it can never merge as-is.
      - dependency-name: "brace-expansion"
      # @ai-sdk/openai-compatible 3.x is specification v4, and `ai@6.0.230`
      # accepts v2/v3 (`ai@latest` is 7.0.107). A PR bumping this alone cannot
      # typecheck — openai-compat-sdk-client.ts:298 fails with "LanguageModelV4
      # is not assignable to LanguageModel" — so there is nothing to merge until
      # `ai` and the other @ai-sdk packages move in step. Measured in #728,
      # tracked as #764. Remove this entry when that lands, not before.
      - dependency-name: "@ai-sdk/openai-compatible"
        update-types: ["version-update:semver-major"]
      # obsidian 1.13 deprecates PluginSettingTab.display() in favour of the
      # declarative getSettingDefinitions(). Taking it means a 42-site rewrite of
      # display() plus 68 imperative `new Setting(...)` calls, and
      # `@typescript-eslint/no-deprecated` is on the Bot's no-disable list, so the
      # warning cannot be suppressed — the bump and the migration are one change.
      # The API itself is NOT removed: its own doc comment calls it "a fallback
      # for plugins that need to support Obsidian versions older than 1.13.0", so
      # minAppVersion does not have to move either. Held until that migration is
      # deliberately planned alongside the settings-UI work (#668, #752, #756),
      # because the one thing it buys is searchability of our settings in
      # Obsidian's own search. Measured in #766.
      - dependency-name: "obsidian"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @types/node 16 -> 26 buys types for Node APIs this project does not use —
      # `node:module` (createRequire) and `node:https` have existed since Node 15 —
      # and costs the `compatibility/indexable.d.ts` shim that 16 ships, which is
      # what currently makes `Array.prototype.at` typecheck under `lib: ES2021`.
      # Taking it needs `lib` raised to ES2022 or 31 `.at()` call sites rewritten;
      # neither is worth a type package with no runtime surface. Measured in #768.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions themselves (checkout/setup-node/attest-build-provenance)
  # are supply-chain surface too — a vulnerable action version is as bad as a
  # vulnerable npm dep. Weekly, low limit; same review path as npm PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
